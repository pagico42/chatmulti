name: Compila APK Android

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Sistema cartelle progetto
        run: |
          mkdir -p app/src/main/java/it/locale/chatmulti
          mkdir -p app/src/main/res/layout
          mv app_build.gradle app/build.gradle
          mv AndroidManifest.xml app/src/main/AndroidManifest.xml
          mv activity_main.xml app/src/main/res/layout/activity_main.xml
          mv ChatEngine.java app/src/main/java/it/locale/chatmulti/ChatEngine.java
          mv MainActivity.java app/src/main/java/it/locale/chatmulti/MainActivity.java

      - name: Setup Java 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Compila APK
        run: |
          gradle wrapper --gradle-version 6.7.1
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Carica APK pronto
        uses: actions/upload-artifact@v4
        with:
          name: ChatLocale-Android4
          path: app/build/outputs/apk/debug/app-debug.apk
